name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coming_test
          POSTGRES_USER: coming
          POSTGRES_PASSWORD: coming
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB_URL: jdbc:postgresql://localhost:5432/coming_test
      DB_USERNAME: coming
      DB_PASSWORD: coming
      JWT_SECRET: dGVzdHNlY3JldGtleWZvcmNpbWluaW11bWxlbmd0aDMyY2hhcnM=
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      KAKAO_CLIENT_ID: test
      KAKAO_CLIENT_SECRET: test
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      OAUTH2_REDIRECT_BASE_URI: http://localhost:3000/auth/callback
      DATA_PIPELINE_SECRET: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # TODO(진단용, 원인 확인 후 제거): V29의 CREATE INDEX CONCURRENTLY가
      # CI에서만 무기한 대기하는 원인을 pg_stat_activity/pg_locks로 실시간 캡처한다.
      - name: Run tests with live lock diagnostics
        run: |
          which psql || (sudo apt-get update -y && sudo apt-get install -y postgresql-client)
          (
            for i in $(seq 1 60); do
              echo "----- poll #$i $(date -u +%H:%M:%S) -----"
              PGPASSWORD="$DB_PASSWORD" psql -h localhost -U "$DB_USERNAME" -d coming_test -c \
                "SELECT pid, state, wait_event_type, wait_event, now()-query_start AS duration, left(query,150) AS query FROM pg_stat_activity WHERE datname='coming_test' ORDER BY query_start;"
              PGPASSWORD="$DB_PASSWORD" psql -h localhost -U "$DB_USERNAME" -d coming_test -c \
                "SELECT l.pid, l.mode, l.granted, l.relation::regclass AS relation, a.state, left(a.query,100) AS query FROM pg_locks l LEFT JOIN pg_stat_activity a ON l.pid = a.pid WHERE l.relation IS NOT NULL ORDER BY l.granted, l.pid;"
              sleep 5
            done
          ) &
          MONITOR_PID=$!
          set +e
          ./gradlew test --no-daemon
          TEST_EXIT=$?
          set -e
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          exit $TEST_EXIT

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker image builds
        run: docker build -t coming-be:verify .
