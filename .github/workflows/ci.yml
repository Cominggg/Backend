name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coming_test
          POSTGRES_USER: coming
          POSTGRES_PASSWORD: coming
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # TODO: V29 마이그레이션의 CREATE INDEX CONCURRENTLY가 CI hang 원인인지 진단 후 이 옵션 제거
      DB_URL: jdbc:postgresql://localhost:5432/coming_test?options=-c%20statement_timeout%3D30000
      DB_USERNAME: coming
      DB_PASSWORD: coming
      JWT_SECRET: dGVzdHNlY3JldGtleWZvcmNpbWluaW11bWxlbmd0aDMyY2hhcnM=
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      KAKAO_CLIENT_ID: test
      KAKAO_CLIENT_SECRET: test
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      OAUTH2_REDIRECT_BASE_URI: http://localhost:3000/auth/callback
      DATA_PIPELINE_SECRET: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker image builds
        run: docker build -t coming-be:verify .
