<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${policyTypeLabel} + ' 변경 안내'">정책 변경 안내</title>
</head>
<body style="margin:0; padding:24px; background-color:#f5f5f5; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#222;">
<div style="max-width:560px; margin:0 auto; background-color:#ffffff; border-radius:8px; padding:32px;">
    <img th:attr="src=|cid:${logoContentId}|" alt="커밍" width="40" height="40" style="display:block; margin:0 0 20px;">

    <h1 style="font-size:18px; margin:0 0 16px;">
        <span th:text="${policyTypeLabel}">이용약관</span> 변경 안내
    </h1>

    <p style="font-size:14px; line-height:1.6;">
        안녕하세요, 커밍입니다.<br>
        <span th:text="${policyTypeLabel}">이용약관</span>이 아래와 같이 변경되어 안내드립니다.
    </p>

    <table style="width:100%; border-collapse:collapse; margin:20px 0; font-size:14px;">
        <tr>
            <td style="padding:8px 0; color:#666; width:100px;">시행일자</td>
            <td style="padding:8px 0;" th:text="${effectiveDate}">2026-01-01</td>
        </tr>
        <tr>
            <td style="padding:8px 0; color:#666; vertical-align:top;">변경 내용</td>
            <td style="padding:8px 0; white-space:pre-line;" th:text="${changeSummary}">변경 내용 요약</td>
        </tr>
    </table>

    <p style="font-size:14px;">
        전체 원문은 아래 링크에서 확인하실 수 있습니다.<br><br>
        <a th:href="${detailUrl}" th:text="${detailUrl}" style="color:#2a5cdd; word-break:break-all;">
            https://comingg.com/policy
        </a>
    </p>

    <hr style="border:none; border-top:1px solid #eee; margin:24px 0;">

    <p style="font-size:12px; color:#999; line-height:1.6;">
        본 메일은 관련 법령에 따른 정책 변경 사전 고지 목적으로 발송되는 필수 안내이며, 수신거부가 적용되지 않습니다.<br>
        발신: 커밍 (<span th:text="${fromAddress}">coming@example.com</span>)
    </p>
</div>
</body>
</html>
